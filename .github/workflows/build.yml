name: Build CrystalDust

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev linux-libc-dev gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Install agbcc (GBA Compiler)
        run: |
          cd agbcc
          chmod +x build.sh install.sh
          find . -type f -name "*.sh" -exec chmod +x {} +
          chmod +x gcc/move-if-change
          ./build.sh
          ./install.sh ../
          cd ..

      - name: Build local repository tools
        run: |
          # Build tools like gftox, pngtosrc, etc., needed for asset compilation
          make -C tools/

      - name: Handle asset and berry_fix requirements
        run: |
          # Create a dummy baserom in case the makefile checks for original asset extraction
          touch baserom.gba
          
          # Create placeholder files to stop the build from crashing on missing berry_fix binaries
          mkdir -p tools/berry_fix
          touch tools/berry_fix/berry_fix.gba
          mkdir -p berry_fix
          touch berry_fix/berry_fix.gba

      - name: Compile ROM
        run: |
          # Compiles using all available processor cores with the nonmatching flag for custom forks
          make -j$(nproc) nonmatching

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crystal_dust_rom
          path: "*.gba"
