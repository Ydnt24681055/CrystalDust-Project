name: Build CrystalDust

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev linux-libc-dev gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Install agbcc (GBA Compiler)
        run: |
          rm -rf agbcc
          git clone https://github.com/pret/agbcc.git
          cd agbcc
          chmod -R +x .
          ./build.sh
          ./install.sh ../
          cd ..

      - name: Build local repository tools
        run: |
          # Clean and rebuild local tools (gftox, pngtosrc) to make sure they process the new graphics folder correctly
          make -C tools/ clean
          make -C tools/

      - name: Handle asset and berry_fix requirements
        run: |
          # Since your real baserom.gba is present, we clear out any previously cached build files 
          # to ensure the compiler processes the new pokehs graphics natively.
          make clean
          
          mkdir -p tools/berry_fix
          touch tools/berry_fix/berry_fix.gba
          mkdir -p berry_fix
          touch berry_fix/berry_fix.gba

      - name: Compile ROM
        run: |
          # Compiles using all available processor cores with the nonmatching flag
          make -j$(nproc) nonmatching

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crystal_dust_rom
          path: "*.gba"
